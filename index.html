<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mwamini Trading - Premium Commodities Portal</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="portal-wrapper">
        <header class="header-nav">
            <h2 style="color: #1e40af; margin: 0; font-weight: 800; letter-spacing: -0.5px;">MWAMINI TRADING</h2>
            <div style="display: flex; gap: 1rem;">
                <button class="btn" id="theme-toggle">Theme</button>
                <a href="login.html" class="btn btn-primary" style="text-decoration: none;">Secure Admin</a>
            </div>
        </header>

        <section class="hero-banner">
            <h1>Premium Wholesale & Retail Commodities</h1>
            <p>Real-time stock validation. Direct dispatch logistics.</p>
            <a href="#" id="dynamic-hotline-btn" class="hotline-badge" style="display: none;">
                📞 Call Direct: <span id="hotline-number-text">...</span>
            </a>
        </section>

        <div class="controls-row">
            <input type="text" id="search-bar" placeholder="Search global inventory..." class="search-input">
            <select id="category-filter" class="filter-select">
                <option value="All">All Categories</option>
                <option value="Grains">Grains</option>
                <option value="Agriculture">Agriculture</option>
                <option value="Construction">Construction</option>
            </select>
            <select id="currency-filter" class="filter-select">
                <option value="USD">USD ($)</option>
                <option value="RWF">RWF (RWF)</option>
            </select>
        </div>

        <main class="commodities-grid" id="public-commodities-view"></main>

        <section class="helpdesk-section">
            <form id="public-review-form">
                <h3>Share Your Experience</h3>
                <input type="text" id="rev-author" placeholder="Your Name" class="search-input" required>
                <button type="submit" class="btn btn-primary">Submit Review</button>
            </form>
            <form id="helpdesk-ticket-form">
                <h3>Secure Support</h3>
                <input type="text" id="ticket-target-email" class="search-input" readonly value="Loading...">
                <button type="button" id="submit-ticket" class="btn btn-primary">Transmit Ticket</button>
            </form>
        </section>
    </div>

    <div class="order-modal" id="order-intake-modal">
        <div class="modal-content">
            <button class="close-modal" id="close-modal-btn">&times;</button>
            <h3 id="modal-product-title">Coordinate Manifest</h3>
            <form id="modal-order-form">
                <input type="hidden" id="modal-product-id">
                <input type="number" id="modal-order-qty" value="1" class="search-input" required>
                <input type="text" id="modal-order-customer" placeholder="Your Enterprise" class="search-input" required>
                <button type="submit" class="btn btn-primary">Confirm Requisition</button>
            </form>
        </div>
    </div>

    <script src="supabase-config.js"></script>
    <script>
        // Use a clean state management object
        const AppState = {
            commodities: [],
            fxRates: { USD: 1, RWF: 1290 }
        };

        document.addEventListener("DOMContentLoaded", async () => {
            await initializeSystem();
            setupEventListeners();
        });

        async function initializeSystem() {
            if (!window.supabase) return;
            
            // Fetch Settings & Products in parallel for speed
            const [settings, products] = await Promise.all([
                window.supabase.from('system_settings').select('*').single(),
                window.supabase.from('products').select('*')
            ]);

            if (settings.data) updateUIWithSettings(settings.data);
            if (products.data) {
                AppState.commodities = products.data;
                renderCatalog(AppState.commodities);
            }
        }

        function setupEventListeners() {
            document.getElementById("search-bar").addEventListener("input", filterData);
            document.getElementById("close-modal-btn").addEventListener("click", () => {
                document.getElementById("order-intake-modal").style.display = "none";
            });
            document.getElementById("theme-toggle").addEventListener("click", () => {
                document.body.dataset.theme = document.body.dataset.theme === 'dark' ? 'light' : 'dark';
            });
        }

        function filterData() {
            const query = document.getElementById("search-bar").value.toLowerCase();
            const filtered = AppState.commodities.filter(item => 
                item.title.toLowerCase().includes(query)
            );
            renderCatalog(filtered);
        }

        function renderCatalog(items) {
            const container = document.getElementById("public-commodities-view");
            container.innerHTML = items.map(item => `
                <div class="commodity-card">
                    <div class="card-body">
                        <h4>${item.title}</h4>
                        <button class="btn btn-primary" onclick="openOrderModal('${item.id}')">Order</button>
                    </div>
                </div>
            `).join('');
        }

        function openOrderModal(id) {
            document.getElementById("modal-product-id").value = id;
            document.getElementById("order-intake-modal").style.display = "flex";
        }
    </script>
</body>
</html>
