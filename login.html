<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Authentication - Mwamini Portal</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            background-color: var(--bg-primary);
        }
        .modal-content {
            background: var(--bg-surface);
            padding: 2.5rem;
            border-radius: 20px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border: 1px solid var(--border-color);
        }
        #login-form { transition: opacity 0.4s ease-in-out; opacity: 1; }
        .loading { opacity: 0.6; pointer-events: none; cursor: wait; }
    </style>
</head>
<body>
    
    <div class="modal-content">
        <div id="gatekeeper-step">
            <h2 style="margin-bottom:1.5rem; text-align:center; color: var(--text-main);">Terminal Access Key</h2>
            <input type="password" id="access-key" class="search-input" placeholder="Enter security key..." style="width:100%; margin-bottom:1.25rem;">
            <button id="verify-key-btn" class="btn btn-primary" style="width:100%;">Authorize Access</button>
        </div>

        <form id="login-form" style="display: none;">
            <h2 style="margin-bottom:1.5rem; text-align:center; color: var(--text-main);">Secure System Terminal</h2>
            
            <label style="display:block; margin-bottom:0.5rem; color:var(--text-muted); font-size:14px;">Master Administrative Email</label>
            <input type="email" id="email" class="search-input" style="width:100%; margin-bottom:1.25rem;" required>
            
            <label style="display:block; margin-bottom:0.5rem; color:var(--text-muted); font-size:14px;">Access Code / Password</label>
            <input type="password" id="password" class="search-input" style="width:100%; margin-bottom:1.5rem;" required>
            
            <button type="submit" id="submit-btn" class="btn btn-primary" style="width:100%;">Establish Session Protocol</button>
        </form>
        
        <p id="error-msg" aria-live="assertive" style="color:#ef4444; font-size:14px; margin-top:1.25rem; text-align:center; min-height:20px;"></p>
    </div>

    <script src="supabase-config.js"></script>
    <script src="auth.js"></script>
    <script>
        // Gatekeeper Logic
        document.getElementById('verify-key-btn').addEventListener('click', () => {
            const key = document.getElementById('access-key').value;
            // Define your secure key logic here
            if (key === "MWAMINI_SECURE_2026") {
                document.getElementById('gatekeeper-step').style.display = 'none';
                document.getElementById('login-form').style.display = 'block';
            } else {
                document.getElementById('error-msg').innerText = "Access denied: Unauthorized key.";
            }
        });
    </script>
</body>
</html>
