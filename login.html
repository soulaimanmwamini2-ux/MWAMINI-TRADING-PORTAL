<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Authentication - Mwamini Portal</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Enhanced modern transitions and state management */
        #login-form { transition: opacity 0.4s ease-in-out; opacity: 1; }
        .loading { opacity: 0.6; pointer-events: none; cursor: wait; }
        
        .input-focus {
            transition: all 0.2s ease;
            border: 1px solid #e2e8f0;
        }
        .input-focus:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        button:active { transform: scale(0.98); }
    </style>
</head>
<body style="display:flex; justify-content:center; align-items:center; min-height:100vh; background-color: #f1f5f9; margin:0;">
    
    <div class="modal-content" style="box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04); background: white; padding: 2.5rem; border-radius:24px; width: 90%; max-width: 450px; border: 1px solid #e2e8f0;">
        
        <div id="gatekeeper-step">
            <h2 style="margin-bottom:0.5rem; text-align:center; font-family: sans-serif; color: #0f172a;">Terminal Access Key</h2>
            <p style="text-align:center; color:#64748b; font-size: 13px; margin-bottom: 1.5rem;">Secure entry required to initialize terminal.</p>
            <input type="password" id="access-key" class="search-input input-focus" placeholder="Enter security key..." style="width:100%; padding:0.85rem; border-radius:12px; margin-bottom:1.25rem; box-sizing:border-box;">
            <button id="verify-key-btn" style="width:100%; padding:0.85rem; background:#0f172a; color:white; border:none; border-radius:12px; font-weight:600; cursor:pointer; transition: background 0.2s;">Authorize Access</button>
        </div>

        <form id="login-form" style="display: none;">
            <h2 style="margin-bottom:1.5rem; text-align:center; font-family: sans-serif; color: #0f172a;">Secure System Terminal</h2>
            <label style="display:block; margin-bottom:0.5rem; font-family:sans-serif; color:#64748b; font-size:13px; font-weight: 600;">Master Administrative Email</label>
            <input type="email" id="email" class="search-input input-focus" style="width:100%; padding:0.85rem; border-radius:12px; margin-bottom:1.25rem; box-sizing:border-box;" required>
            
            <label style="display:block; margin-bottom:0.5rem; font-family:sans-serif; color:#64748b; font-size:13px; font-weight: 600;">Access Code / Password</label>
            <input type="password" id="password" class="search-input input-focus" style="width:100%; padding:0.85rem; border-radius:12px; margin-bottom:1.5rem; box-sizing:border-box;" required>
            
            <button type="submit" id="submit-btn" class="btn btn-primary" style="width:100%; padding:0.85rem; background:#2563eb; color:white; border:none; border-radius:12px; font-weight:600; cursor:pointer;">Establish Session Protocol</button>
        </form>
        
        <p id="error-msg" aria-live="assertive" style="color:#ef4444; font-size:13px; margin-top:1.25rem; text-align:center; font-family:sans-serif; min-height:20px; font-weight: 500;"></p>
    </div>

    <script src="supabase-config.js"></script>
    <script src="auth.js"></script>
    <script>
        // Logic to toggle between steps
        document.getElementById('verify-key-btn').addEventListener('click', () => {
            const key = document.getElementById('access-key').value;
            // Add your security key check logic here
            if (key === "YOUR_SECRET_KEY") {
                document.getElementById('gatekeeper-step').style.display = 'none';
                document.getElementById('login-form').style.display = 'block';
            } else {
                document.getElementById('error-msg').innerText = "Invalid Access Key";
            }
        });
    </script>
</body>
</html>
